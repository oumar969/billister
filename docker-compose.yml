version: '3.8'

services:
  # .NET Backend API
  billister-api:
    build:
      context: ./Billister
      dockerfile: Dockerfile
    ports:
      - "5012:5012"
      - "7012:7012"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5012;https://+:7012
      - DmrService__ApiKey=${DMR_API_KEY}
    depends_on:
      - dmr-service
    networks:
      - billister-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5012/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Python DMR Lookup Service
  dmr-service:
    build:
      context: ./services/dmr-service
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - FLASK_ENV=production
      - DMR_API_KEY=${DMR_API_KEY}
      - DMR_REQUIRE_AUTH=true
    networks:
      - billister-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  billister-network:
    driver: bridge
